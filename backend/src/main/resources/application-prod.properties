# Nombre: application-prod.properties
# Descripción: Perfil prod (Render + Neon): todo por variables de entorno; HTTP detrás del proxy TLS de la
#              plataforma; Flyway solo con las migraciones V1 a V3; pool pequeño y primer administrador.
# Fecha de creación: 2026-10-20
# Última actualización: 2026-10-21
# Autor: Juan Pablo Artunduaga Pérez (generado con Claude Code)

# --- Base de datos (Neon) ---
# DB_URL usa el endpoint DIRECTO de Neon (host sin "-pooler") con SSL obligatorio, por ejemplo
# jdbc:postgresql://ep-nombre-123456.us-east-2.aws.neon.tech/neondb?sslmode=require
# Flyway necesita una sesión estable; el pooler de Neon (PgBouncer en modo transacción) no la garantiza.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool pequeño: plan gratuito de Neon y 512 MB en Render. Neon suspende la base tras unos minutos sin uso
# y corta las conexiones; vida máxima corta y keepalive hacen que Hikari las renueve sin errores.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.idle-timeout=120000
# Al despertar, Neon tarda unos segundos en aceptar la primera conexión
spring.datasource.hikari.connection-timeout=30000

# --- Flyway: solo el esquema (V1), los reportes (V2) y la auditoría (V3) ---
# Nunca los datos de dev (db/devdata), e2e (db/e2edata) ni de pruebas (db/testdata).
spring.flyway.locations=classpath:db/migration

# --- HTTP detrás del proxy TLS de Render ---
# La plataforma termina TLS y reenvía X-Forwarded-*; así la app sabe que la solicitud fue HTTPS
# y Spring Security envía la cabecera HSTS (RNF-SEG-006)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Versión desplegada: /actuator/info muestra el commit (Render define RENDER_GIT_COMMIT) ---
# La verificación de humo de .github/workflows/deploy.yml espera a que coincida con el commit probado.
management.info.env.enabled=true
info.app.commit=${RENDER_GIT_COMMIT:desconocido}

# --- Primer administrador (RF-SEG-001; lo crea InicializadorAdministrador si no existe ninguno) ---
app.admin.usuario=${ADMIN_USUARIO:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.correo=${ADMIN_CORREO:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}

# Especificación OpenAPI publicada salvo que se apague por variable (RNF-COM-001);
# Swagger UI queda apagado (solo dev, ver application.properties)
springdoc.api-docs.enabled=${OPENAPI_HABILITADO:true}

logging.level.root=INFO
