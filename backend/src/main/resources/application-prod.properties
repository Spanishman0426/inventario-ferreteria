# Nombre: application-prod.properties
# Descripción: Perfil prod: todo por variables de entorno; HTTP detrás del proxy TLS de la plataforma.
# Fecha de creación: 2026-10-20
# Última actualización: 2026-10-20
# Autor: Juan Pablo Artunduaga Pérez (generado con Claude Code)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# La plataforma termina TLS y reenvía X-Forwarded-*; así la app sabe que la solicitud fue HTTPS
# y Spring Security envía la cabecera HSTS (RNF-SEG-006)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Especificación OpenAPI publicada salvo que se apague por variable (RNF-COM-001);
# Swagger UI queda apagado (solo dev, ver application.properties)
springdoc.api-docs.enabled=${OPENAPI_HABILITADO:true}

logging.level.root=INFO
