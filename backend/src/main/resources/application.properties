# Nombre: application.properties
# Descripción: Configuración común a todos los perfiles del backend.
# Fecha de creación: 2026-10-20
# Última actualización: 2026-10-20
# Autor: Juan Pablo Artunduaga Pérez (generado con Claude Code)

spring.application.name=inventario
# Sin perfil explícito se usa dev (desarrollo local)
spring.profiles.default=dev

# --- JPA: el esquema lo crea Flyway; Hibernate solo lo valida (regla del proyecto) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Flyway: V1 esquema, V2 reportes; el esquema ya trae sus propios objetos ---
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- Zona horaria (RNF-INT-003) ---
spring.jackson.time-zone=America/Bogota

# --- Internacionalización: español por defecto, inglés como segundo idioma ---
# El MessageSource (messages_* y ValidationMessages_*) se declara en config/LocaleConfig.java

# --- Seguridad: no crear el usuario en memoria de Spring Boot ---
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Seguridad: JWT, CORS y bloqueo (RF-SEG-001, RNF-SEG-006) ---
# La clave y el origen del frontend llegan solo por variables de entorno; sin ellas no arranca
app.seguridad.jwt-secret=${JWT_SECRET:}
app.seguridad.jwt-vigencia=30m
app.seguridad.frontend-url=${FRONTEND_URL:}
app.seguridad.intentos-maximos=5
app.seguridad.duracion-bloqueo=15m

# --- Actuator: solo salud e información, sin detalles internos ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- OpenAPI (RNF-COM-001) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Errores: nunca exponer trazas ni mensajes internos ---
server.error.include-stacktrace=never
server.error.include-message=never
