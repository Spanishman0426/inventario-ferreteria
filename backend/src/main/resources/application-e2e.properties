# Nombre: application-e2e.properties
# Descripción: Perfil e2e: base de pruebas descartable con el escenario de database/02_datos_prueba.sql
#              (db/e2edata), contraseñas de admin, jefe y vendedor por variables de entorno y HTTP interno
#              detrás del frontend (docker-compose.e2e.yml). Nunca se usa contra la base de producción.
# Fecha de creación: 2026-10-21
# Última actualización: 2026-10-21
# Autor: Juan Pablo Artunduaga Pérez (generado con Claude Code)

# --- Base de datos (credenciales solo por variables de entorno) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- HTTP dentro de la red de Docker: el navegador habla con el frontend (nginx), que reenvía /api ---
# HTTPS (RNF-SEG-006) lo aporta el despliegue; aquí se prueba la aplicación, no el certificado.
server.port=${PORT:8080}

# --- Flyway: esquema (db/migration) y escenario de prueba (db/e2edata) ---
# R__datos_prueba_e2e.sql no es idempotente: la base del entorno e2e se crea vacía en cada arranque.
spring.flyway.locations=classpath:db/migration,classpath:db/e2edata

# --- Contraseñas de los usuarios de prueba (InicializadorUsuariosE2e); sin ellas no arranca ---
app.e2e.password.admin=${E2E_ADMIN_PASSWORD:}
app.e2e.password.jefe=${E2E_JEFE_PASSWORD:}
app.e2e.password.vendedor=${E2E_VENDEDOR_PASSWORD:}

logging.level.co.ferreteria=INFO
