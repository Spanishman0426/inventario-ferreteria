# Nombre: application-dev.properties
# Descripción: Perfil dev: PostgreSQL local (ferreteria_dev), HTTPS en el puerto 8443 con certificado autofirmado
#              y creación del primer administrador.
# Fecha de creación: 2026-10-20
# Última actualización: 2026-10-20
# Autor: Juan Pablo Artunduaga Pérez (generado con Claude Code)

# Lee backend/.env si existe (copiado de .env.example); las variables del sistema tienen prioridad
spring.config.import=optional:file:.env[.properties]

# --- Base de datos local (credenciales solo por variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ferreteria_dev}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- HTTPS (RNF-SEG-006); el keystore lo crea scripts/generar-certificado-dev ---
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:certs/dev-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=ferreteria-dev

# --- Frontend local de Vite (CORS) ---
app.seguridad.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Primer administrador (lo crea InicializadorAdministrador si no existe ninguno) ---
app.admin.usuario=${ADMIN_USUARIO:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.correo=${ADMIN_CORREO:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}

logging.level.co.ferreteria=DEBUG
