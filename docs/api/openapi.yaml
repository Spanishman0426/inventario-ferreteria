          description: Sin token válido
      security:
      - bearerAuth: []
      summary: Usuario autenticado
      tags:
      - Autenticación
  /api/v1/categorias:
    get:
      description: "Lista paginada con categorías activas e inactivas. `page` empieza\
        \ en 0; `size` va de 1 a 100 (20 por defecto). `sort` admite `id` y `nombre`,\
        \ con `,asc` o `,desc`; por defecto `nombre,asc`. Para los selectores use\
        \ GET /api/v1/categorias/activas."
      operationId: listarCategorias
      parameters:
      - description: "Texto contenido en el nombre, sin distinguir mayúsculas."
        example: herra
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: Estado de la categoría; sin valor devuelve todas.
        in: query
        name: estado
        required: false
        schema:
          type: string
          enum:
          - ACTIVO
          - INACTIVO
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          default:
          - "nombre,ASC"
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaElementoCatalogo"
          description: Página de categorías
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
      security:
      - bearerAuth: []
      summary: Buscar categorías
      tags:
      - Categorías
    post:
      description: El nombre se recorta y no se repite sin distinguir mayúsculas.
        La categoría queda ACTIVA.
      operationId: crearCategoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElementoCatalogoPeticion"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoCatalogo"
          description: Creada
          headers:
            Location:
              description: URL de la categoría creada
              schema:
                type: string
                format: uri
                example: /api/v1/categorias/10
              style: simple
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
      security:
      - bearerAuth: []
      summary: Registrar categoría
      tags:
      - Categorías
  /api/v1/categorias/activas:
    get:
      description: "Lista completa, sin paginar, ordenada por nombre. Alimenta el\
        \ selector de categoría de los productos nuevos; al editar, el producto conserva\
        \ su categoría aunque esté inactiva."
      operationId: listarCategoriasActivas
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Referencia"
          description: Categorías activas
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
      security:
      - bearerAuth: []
      summary: Listar categorías activas
      tags:
      - Categorías
  /api/v1/categorias/{id}:
    put:
      description: "Cambia el nombre; el estado se cambia con PATCH /api/v1/categorias/{id}/estado."
      operationId: actualizarCategoria
      parameters:
      - description: Id de la categoría.
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElementoCatalogoPeticion"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoCatalogo"
          description: Actualizada
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
      - bearerAuth: []
      summary: Editar categoría
      tags:
      - Categorías
  /api/v1/categorias/{id}/estado:
    patch:
      description: "Una categoría en uso no se elimina, solo se desactiva (RF-CFG-001):\
        \ deja de ofrecerse a productos nuevos y los existentes la conservan. Es idempotente."
      operationId: cambiarEstadoCategoria
      parameters:
      - description: Id de la categoría.
        example: 1
        in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioEstadoCatalogo"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementoCatalogo"
          description: Estado aplicado
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
      security:
      - bearerAuth: []
      summary: Activar o desactivar categoría
      tags:
      - Categorías
  /api/v1/marcas:
    get:
      description: "Lista paginada con marcas activas e inactivas. `page` empieza\
