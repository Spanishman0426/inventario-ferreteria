  /api/v1/auth/login:
    post:
      description: Valida usuario y contraseña. Cinco intentos fallidos bloquean la
        cuenta 15 minutos.
      operationId: iniciarSesion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudInicioSesion"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaInicioSesion"
          description: Token emitido
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaInicioSesion"
          description: Datos incompletos
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaInicioSesion"
          description: Credenciales inválidas o cuenta inactiva
        "423":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RespuestaInicioSesion"
          description: Cuenta bloqueada por intentos fallidos
      summary: Iniciar sesión
      tags:
      - Autenticación
