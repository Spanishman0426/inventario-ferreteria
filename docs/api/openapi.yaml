openapi: 3.1.0
info:
  description: "Catálogo, compras, ventas, existencias, cierres y reportes de una\
    \ ferretería con una sola bodega."
  title: API del Sistema de Inventario de Ferretería
  version: v1
servers:
- description: Servidor actual
  url: /
tags:
- description: "Usuarios, roles y activación de cuentas (RF-SEG-001)"
  name: Usuarios
- description: Inicio de sesión con JWT (RF-SEG-001)
  name: Autenticación
- description: "Catálogo de productos (RF-PRO-001, RF-PRO-003)"
  name: Productos
- description: Consulta de la auditoría de operaciones e inicios de sesión (RF-SEG-002)
  name: Auditoría
- description: Administración del catálogo de marcas (RF-CFG-001)
  name: Marcas
- description: Unidades de medida y tarifas de IVA para selectores
  name: Catálogos de referencia
- description: Administración del catálogo de categorías (RF-CFG-001)
  name: Categorías
paths:
  /api/v1/auditoria:
    get:
      operationId: listarAuditoria
      parameters:
      - in: query
        name: usuarioId
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - in: query
        name: entidad
        required: false
        schema:
          type: string
          maxLength: 60
          minLength: 0
          pattern: "^[a-z_]+$"
      - description: "CREAR, MODIFICAR, ELIMINAR, ANULAR, APROBAR, CAMBIAR_ESTADO,\
          \ INICIAR_SESION, SESION_FALLIDA o DEPURAR"
        in: query
        name: accion
        required: false
        schema:
          type: string
          pattern: ^(CREAR|MODIFICAR|ELIMINAR|ANULAR|APROBAR|CAMBIAR_ESTADO|INICIAR_SESION|SESION_FALLIDA|DEPURAR)$
      - in: query
        name: desde
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: hasta
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: pagina
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: tamano
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaRegistroAuditoriaResumen"
          description: Página de registros
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaRegistroAuditoriaResumen"
          description: Filtro no válido
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaRegistroAuditoriaResumen"
          description: Sin token válido
        "403":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaRegistroAuditoriaResumen"
          description: Sin el permiso AUDITORIA_VER
      security:
      - bearerAuth: []
      summary: Listar auditoría
      tags:
      - Auditoría
  /api/v1/auditoria/{id}:
    get:
      operationId: obtenerRegistroAuditoria
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
