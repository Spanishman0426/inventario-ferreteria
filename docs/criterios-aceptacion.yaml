# Nombre: criterios-aceptacion.yaml
# Descripción: Catálogo de criterios de aceptación de los requisitos implementados (RF-PRO-001,
#              RF-PRO-003, RF-TER-001, RF-CFG-001, RF-SEG-001, RF-SEG-002) y de los RNF de seguridad, eficiencia,
#              interacción y mantenibilidad que aplican, con sus casos de prueba por nivel y los escenarios
#              E2E que los cubren. Fuente de docs/pruebas/casos-de-prueba.md y de scripts/criterios.mjs.
# Fecha de creación: 2026-10-20
# Última actualización: 2026-10-22
# Autor: Juan Pablo Artunduaga Pérez (generado con Claude Code)
#
# Convenciones
# - id: CA-<requisito>-<n>; n sigue el orden en que el criterio aparece en la especificación.
#   Los RNF tienen un solo criterio en la especificación; cuando ese criterio contiene varias
#   condiciones separadas por ";", cada una recibe su propio número.
# - descripcion: texto tomado de docs/especificacion-requisitos.md.
# - niveles: unitaria (JUnit + Mockito, sin Spring, en el backend; Vitest + Testing Library con los
#   servicios simulados, en el frontend), integracion (MockMvc de capa web y @SpringBootTest con
#   PostgreSQL en Testcontainers), e2e (Playwright / Selenium) y carga (k6).
# - observacion: aclara cuándo la funcionalidad aún no existe o la prueba cubre solo una parte.
# - e2e: escenarios de e2e/playwright y e2e/selenium que verifican el criterio (los mismos en las dos
#   herramientas); cada escenario lleva en su nombre el id del escenario y los ids de sus criterios.
# - Criterios derivados (sufijo D<n>, por ejemplo CA-RF-SEG-001-D1): no están en la lista de criterios
#   de la especificación, pero se desprenden de su flujo principal, de la matriz 2.2 o de las reglas
#   del proyecto (internacionalización). Se agregan para que todo escenario E2E tenga un criterio
#   verificable; el campo origen indica de dónde sale cada uno.
# - casos: casos de prueba del criterio, uno por nivel (a veces más). Cada caso tiene nivel, pasos,
#   datos y esperado. El id del caso lo asigna scripts/casos-de-prueba.mjs (CP-<criterio>-<nn>, en el
#   orden de esta lista) y el archivo que lo implementa se busca en el código por el id del criterio
#   y el nivel. Un caso de un criterio pendiente describe la prueba prevista.
# - medicion (opcional): cómo se evalúa el criterio cuando no es una prueba con nombre: "k6" (umbral del
#   resumen de load-tests/productos.js) o "jacoco" (cobertura de líneas de backend/target/site/jacoco).
# - Cada prueba que verifica un criterio lleva su id al inicio del nombre visible, por ejemplo
#   "[CA-RF-PRO-001-2] rechaza producto sin marca".
#
# No se incluyen: RNF-INT-001 (venta con lector y teclado: ventas aún no implementadas), RNF-REN-002
# (reportes y kardex: sin módulos todavía), RNF-FIA y RNF-COM-001 (fuera del alcance de este paso).

criterios:

  # ------------------------------------------------------------------ RF-PRO-001 Registrar producto
  - id: CA-RF-PRO-001-1
    requisito: RF-PRO-001
    descripcion: Un producto válido queda registrado y puede consultarse.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-02]
    casos:
      - nivel: unitaria
        pasos:
          - Crear una petición completa con marca, categoría, unidad, tarifa y control (backend) o llenar el formulario (frontend).
          - Llamar a ProductoService.crear con los repositorios simulados, o enviar el formulario con el servicio simulado.
        datos: Nombre "  Martillo de uña 16 oz  ", marca 1, categoría 1, UND, IVA 19 %, margen 30, garantía 12 meses.
        esperado: Se guarda con nombre recortado, descripción en blanco como nula y estado ACTIVO; el formulario llama al servicio una vez.
      - nivel: integracion
        pasos:
          - Iniciar sesión como jefe de inventario.
          - POST /api/v1/productos con un producto válido.
          - GET /api/v1/productos/{id} y buscar por nombre.
        datos: Producto con nombre único (UUID), marca 1, categoría 1, UND, tarifa 3, margen 30, control NINGUNO.
        esperado: 201 con Location; el GET devuelve los mismos datos y la búsqueda lo encuentra; se audita un CREAR.
      - nivel: e2e
        pasos:
          - Entrar como jefe de inventario y abrir Productos.
          - Crear un producto con garantía y plazo desde el formulario.
          - Buscarlo por nombre.
        datos: Nombre "E2E PW/SE <sello>", garantía 12 meses.
        esperado: Notificación de éxito; la tabla lo muestra con marca, categoría, unidad, IVA y estado Activo.

  - id: CA-RF-PRO-001-2
    requisito: RF-PRO-001
    descripcion: Se rechaza un producto sin marca, sin unidad base, sin tarifa de IVA o con garantía sin plazo.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-03]
    casos:
      - nivel: unitaria
        pasos:
          - Validar la petición con Bean Validation / GarantiaConPlazoValidator (backend) o con productoSchema de Yup (frontend).
          - Llamar al servicio con referencias inexistentes o inactivas.
        datos: Petición sin marcaId, sin unidadBase y sin tarifaIvaId; control GARANTIA sin plazo; marca inactiva.
        esperado: Un error por campo (marcaId, unidadBase, tarifaIvaId, plazoGarantiaMeses) y nada se guarda.
      - nivel: integracion
        pasos:
          - POST /api/v1/productos con los campos obligatorios vacíos o con garantía sin plazo.
          - Insertar por SQL un producto sin marca, sin unidad o sin tarifa, y otro con garantía sin plazo.
        datos: Token de jefe; JSON sin marcaId, unidadBase ni tarifaIvaId; control GARANTIA sin plazoGarantiaMeses.
        esperado: 400 con un error en cada campo; por SQL 23502 (NOT NULL) y 23514 (ck_producto_garantia).
      - nivel: e2e
        pasos:
          - Abrir el formulario de nuevo producto y guardar vacío.
          - Escribir valores fuera de rango y elegir garantía sin plazo.
        datos: Nombre de 2 caracteres, porcentaje 501, garantía sin plazo.
        esperado: Cada campo muestra su etiqueta y la causa; no se envía nada al servidor.

  - id: CA-RF-PRO-001-3
    requisito: RF-PRO-001
    descripcion: Se rechaza un duplicado de nombre y marca, indicando la causa.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-07]
    casos:
      - nivel: unitaria
        pasos:
          - Simular que el repositorio ya tiene el nombre para la marca.
          - Llamar a ProductoService.crear o actualizar.
        datos: Nombre existente con otras mayúsculas, misma marca.
        esperado: ConflictoException con nombre y marca; no se llama a save.
      - nivel: integracion
        pasos:
          - Crear un producto por la API y repetir la creación con el mismo nombre en otras mayúsculas.
          - Insertar el duplicado por SQL y con el repositorio JPA, sin pasar por el servicio.
        datos: Mismo nombre y marca; Accept-Language es y en.
        esperado: 409 CONFLICTO_UNICIDAD con la causa traducida; por SQL o JPA, 23505 (ux_producto_marca_nombre).
      - nivel: e2e
        pasos:
          - Crear un producto por API y luego otro igual desde el formulario.
          - Cambiar solo la marca y guardar de nuevo.
        datos: Mismo nombre y marca; después otra marca.
        esperado: El campo nombre muestra la causa del servidor; con otra marca sí se registra.

  - id: CA-RF-PRO-001-D1
    requisito: RF-PRO-001
    descripcion: Un producto registrado puede editarse y los cambios quedan visibles en la consulta.
    origen: Matriz 2.2, operación "Crear y editar productos y presentaciones".
    niveles: [e2e]
    e2e: [E2E-04]
    casos:
      - nivel: e2e
        pasos:
          - Crear un producto por API.
          - Editar nombre, marca y porcentaje desde la interfaz.
          - Buscar por el nombre anterior y por el nuevo.
        datos: Producto "E2E ... <sello>"; nueva marca y margen 45.
        esperado: El nombre anterior ya no aparece; el nuevo se muestra con la marca y el margen editados.

  # ------------------------------------------------------------------ RF-PRO-003 Buscar y consultar productos
  - id: CA-RF-PRO-003-1
    requisito: RF-PRO-003
    descripcion: Un código registrado devuelve exactamente su presentación.
    niveles: [integracion, e2e, carga]
    observacion: Pendiente; depende de las presentaciones y códigos de barras (RF-PRO-002), aún no implementados.
    casos:
      - nivel: integracion
        pasos:
          - Consultar por la API el código de barras de una presentación del escenario.
        datos: Código 7702001000012 (presentación 1 del escenario de prueba).
        esperado: Una sola presentación, la 1, con su producto. (Prueba prevista.)

  - id: CA-RF-PRO-003-2
    requisito: RF-PRO-003
    descripcion: Las existencias mostradas coinciden con la suma de movimientos y cambios de estado.
    niveles: [integracion, e2e]
    observacion: Pendiente; la consulta de existencias por estado y lote aún no está implementada.
    casos:
      - nivel: integracion
        pasos:
          - Consultar las existencias de cada producto del escenario por la API.
          - Compararlas con la suma del kardex (v_kardex) por estado.
        datos: Escenario de database/02_datos_prueba.sql.
        esperado: 0 discrepancias, como PC-02 del plan de pruebas de la base. (Prueba prevista.)

  - id: CA-RF-PRO-003-3
    requisito: RF-PRO-003
    descripcion: Un vendedor no ve costos.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-08]
    casos:
      - nivel: unitaria
        pasos:
          - Convertir un producto a respuesta con y sin el permiso COSTOS_VER (backend).
          - Renderizar la página de productos con un usuario sin COSTOS_VER (frontend).
        datos: Producto con margen 30 y último costo 18.000.
        esperado: Sin el permiso no se incluyen porcentajeIncremento ni ultimoCostoBase, y la tabla no muestra la columna.
      - nivel: integracion
        pasos:
          - Consultar el mismo producto con el token del vendedor y con el del gerente.
        datos: Usuarios vendedor y gerente del escenario.
        esperado: El JSON del vendedor omite margen y costo; el del gerente los trae.
      - nivel: e2e
        pasos:
          - Entrar como vendedor y abrir Productos.
        datos: Usuario vendedor.
        esperado: No hay columna de costos ni botones de edición.

  - id: CA-RF-PRO-003-D1
    requisito: RF-PRO-003
    descripcion: >-
      La búsqueda por nombre, sin distinguir mayúsculas, y los filtros por categoría y estado devuelven
      solo los productos que cumplen todos los criterios; sin coincidencias se informa que no hay resultados.
    origen: Descripción y pasos 1 y 2 del flujo principal de RF-PRO-003.
    niveles: [e2e]
    e2e: [E2E-05]
    casos:
      - nivel: e2e
        pasos:
          - Crear por API tres productos propios, uno inactivo.
          - Buscar con otras mayúsculas y combinar filtros de categoría y estado.
          - Buscar un texto sin coincidencias.
        datos: Tres productos "E2E ... <sello>" en dos categorías.
        esperado: Solo aparecen los que cumplen todos los filtros; sin coincidencias se muestra el aviso de sin resultados.

  # ------------------------------------------------------------------ RF-TER-001 Registrar clientes y proveedores
  - id: CA-RF-TER-001-1
    requisito: RF-TER-001
    descripcion: Se registra una persona natural con cédula, nombre y apellido, y una jurídica con NIT y razón social.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-13, E2E-14]
    casos:
      - nivel: unitaria
        pasos:
          - Validar TerceroPeticion con TerceroCoherente y llamar a TerceroService.crear con el repositorio simulado (backend).
          - Llenar TerceroFormDialog como persona natural y como jurídica, y validar terceroSchema (frontend, servicio simulado).
        datos: Natural CC 1075234567 "  Ana " "Rojas"; jurídica NIT 890903938-8 Bancolombia S.A.; natural sin nombre; jurídica sin razón social o con CC.
        esperado: >-
          Las dos válidas se guardan con textos recortados y sin los campos que no aplican (razón social en la natural;
          nombre y apellido en la jurídica). Al elegir persona jurídica el formulario cambia a NIT y razón social. Sin
          nombre, apellido o razón social, o una jurídica con CC: error en ese campo y no se envía.
      - nivel: integracion
        pasos:
          - Como vendedor, POST /api/v1/terceros con una persona natural; GET /api/v1/terceros/{id}.
          - Como comprador, POST con una persona jurídica proveedora; consultar la fila en la base.
        datos: Cédula de 10 dígitos y NIT de 9 dígitos aleatorios, con el dígito calculado por DigitoVerificacionNit.
        esperado: 201 en ambos; la natural vuelve con nombre mostrado "Ana Rojas" y sin dígito; la jurídica queda con su dígito y razón social, sin nombre.
      - nivel: e2e
        pasos:
          - Persona natural (E2E-13). Como vendedor, abrir Terceros desde el menú, crear con cédula, nombre, apellido, dirección y teléfono; buscar por cédula.
          - Persona jurídica (E2E-14). Como administrador, elegir Persona jurídica, escribir el NIT, razón social y contacto; guardar y buscar por NIT.
        datos: Cédula y NIT únicos por ejecución (e2e/comun/datos.js), con el dígito calculado aparte.
        esperado: >-
          Notificación de registro; la natural aparece como "CC <número>" con el rol Cliente; la jurídica oculta nombre y
          apellido, fija NIT, calcula el dígito en vivo y aparece como "NIT <número>-<dígito>".

  - id: CA-RF-TER-001-2
    requisito: RF-TER-001
    descripcion: Un mismo tercero puede marcarse como cliente y proveedor.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-14]
    casos:
      - nivel: unitaria
        pasos:
          - Validar y crear un tercero con esCliente y esProveedor en TerceroService con los dos permisos (backend).
          - Marcar las dos casillas en TerceroFormDialog como administrador y validar terceroSchema (frontend).
        datos: Jurídica NIT 890903938-8 con los dos roles; tercero sin ningún rol.
        esperado: El servicio lo guarda con los dos roles; el formulario deja marcar ambas casillas; sin ningún rol, error "Marque al menos un rol".
      - nivel: integracion
        pasos:
          - Como gerente, POST /api/v1/terceros con esCliente y esProveedor en true.
          - Buscar con q = NIT y rol = CLIENTE, y con rol = PROVEEDOR.
        datos: NIT aleatorio con su dígito.
        esperado: 201; el tercero aparece con los dos filtros de rol y la fila tiene es_cliente y es_proveedor en true.
      - nivel: e2e
        pasos:
          - Como administrador, crear una persona jurídica con Cliente (marcado por defecto) y marcar Proveedor (E2E-14).
        datos: NIT único por ejecución.
        esperado: Las dos casillas quedan marcadas y la fila muestra los roles Cliente y Proveedor.

  - id: CA-RF-TER-001-3
    requisito: RF-TER-001
    descripcion: Se rechaza una identificación duplicada o un NIT con dígito de verificación incorrecto.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-15, E2E-16]
    casos:
      - nivel: unitaria
        pasos:
          - Calcular DigitoVerificacionNit (backend) y calcularDigitoVerificacion de src/utils/nit.js (frontend) con NIT reales.
          - Validar un NIT con dígito erróneo (TerceroCoherente, terceroSchema, TerceroFormDialog) y crear un duplicado en TerceroService.
          - En TerceroFormDialog, simular un 409 del servicio.
        datos: 890903938-8, 899999068-1 y 800197268-4 (y los NIT de los datos de prueba); dígito 3 en lugar de 8; CC 1075234567 repetida.
        esperado: >-
          Los dos algoritmos dan 8, 1 y 4. Un dígito distinto es error en digitoVerificacion con el dígito correcto; el
          duplicado lanza ConflictoException; el 409 se muestra bajo el número de identificación.
      - nivel: integracion
        pasos:
          - POST /api/v1/terceros con el NIT de Distribuidora Pavco (900123456-8, datos de prueba).
          - POST con un NIT nuevo y un dígito incorrecto; PUT de un tercero con la cédula de otro.
          - Capa web (TerceroControllerWebTests). POST con dígito erróneo, en español e inglés.
        datos: NIT 900123456; NIT aleatorio con dígito + 1; CC 1075234567 de Juan Pérez Gómez.
        esperado: >-
          409 CONFLICTO_UNICIDAD "Ya existe un tercero con identificación NIT 900123456."; 400 en digitoVerificacion
          "no corresponde al NIT; el dígito correcto es 8" sin crear la fila; la misma cifra con CC sí se registra.
      - nivel: e2e
        pasos:
          - Dígito incorrecto (E2E-15). Como administrador, escribir un NIT, cambiar el dígito calculado por otro y guardar; enviar lo mismo por API.
          - Duplicado (E2E-16). Como vendedor, registrar una persona natural con la cédula de Juan Pérez Gómez.
        datos: NIT único con dígito + 1; CC 1075234567.
        esperado: >-
          El formulario muestra "No corresponde al NIT; el dígito correcto es <d>." bajo el dígito, sigue abierto y la API
          responde 400 (el NIT no queda registrado). El duplicado muestra la causa del servidor bajo el número.

  - id: CA-RF-TER-001-4
    requisito: RF-TER-001
    descripcion: El tercero Consumidor final existe desde la instalación y no puede editarse ni eliminarse.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-13]
    casos:
      - nivel: unitaria
        pasos:
          - Llamar a TerceroService.actualizar y cambiarEstado con el Consumidor final y todos los permisos (backend).
          - Abrir el Consumidor final en TerceroFormDialog y listarlo en TercerosPage como administrador (frontend).
        datos: Tercero con esConsumidorFinal = true (CC 222222222222).
        esperado: >-
          OperacionRechazadaException REGLA_NEGOCIO tercero.consumidor_final_no_editable sin guardar; el formulario se abre
          en solo lectura con el motivo y sin Guardar; la tabla lo marca Predefinido sin editar ni desactivar.
      - nivel: integracion
        pasos:
          - Buscar q = 222222222222; PUT y PATCH .../estado sobre el id 1; DELETE /api/v1/terceros/1.
          - Capa web. Mensaje del 422 en español e inglés.
        datos: Consumidor final sembrado por V1.
        esperado: Aparece con esConsumidorFinal true; PUT y PATCH responden 422 REGLA_NEGOCIO con mensaje claro; DELETE 405; la fila no cambia y no se audita nada.
      - nivel: e2e
        pasos:
          - Como vendedor, buscar 222222222222 en Terceros y abrirlo (E2E-13).
        datos: Consumidor final.
        esperado: Chip Predefinido, sin botones de editar ni desactivar; se abre en solo lectura sin Guardar.

  # ------------------------------------------------------------------ RF-CFG-001 Configuración y catálogos
  - id: CA-RF-CFG-001-3
    requisito: RF-CFG-001
    descripcion: Un elemento de catálogo en uso no se elimina; solo se desactiva.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-06, E2E-11]
    observacion: >-
      Cubre productos, marcas y categorías. Los motivos se agregarán cuando se administren (fuera del
      módulo M0).
    casos:
      - nivel: unitaria
        pasos:
          - Llamar a MarcaService.cambiarEstado y CategoriaService.cambiarEstado con los repositorios simulados (backend).
          - En CatalogosPage, pulsar Desactivar, cancelar y luego confirmar (frontend, servicio simulado).
        datos: Marca Stanley activa y categoría Plomería ya inactiva.
        esperado: >-
          La marca queda INACTIVA sin llamar a delete; desactivar lo ya inactivo no escribe; la página no
          ofrece eliminar, cancelar no llama al servicio y confirmar envía INACTIVO.
      - nivel: integracion
        pasos:
          - Producto. DELETE /api/v1/productos/{id} con el token del jefe; consultarlo y repetir el DELETE.
          - Marcas y categorías. Como administrador, crear una y un producto que la use; PATCH .../{id}/estado con INACTIVO y repetirlo; buscar con estado=INACTIVO, consultar el producto e intentar DELETE.
        datos: Producto, marca y categoría con nombre único creados para la prueba.
        esperado: >-
          Producto: 204, sigue existiendo como INACTIVO y consultable. Marca o categoría: 200 INACTIVO, la fila
          sigue en la base y en la búsqueda y el producto la conserva; DELETE responde 405. Repetir la
          desactivación no audita de nuevo.
      - nivel: e2e
        pasos:
          - Producto (E2E-06). Pulsar Desactivar y cancelar el diálogo; pulsar Desactivar y confirmar.
          - Marca (E2E-11). Como administrador, crearla en Catálogos; pulsar Desactivar y cancelar; pulsar Desactivar y confirmar.
        datos: Producto creado por API; marca "E2E <herramienta> Marca <sello>".
        esperado: >-
          Cancelar no cambia nada; confirmar deja el producto Inactivo, sin botón de desactivar y aún
          editable, y la marca Inactiva y aún listada.

  - id: CA-RF-CFG-001-D1
    requisito: RF-CFG-001
    descripcion: >-
      Los selectores del formulario de producto ofrecen solo marcas y categorías activas; un producto
      existente conserva la suya aunque esté inactiva.
    origen: >-
      Paso 6 del flujo principal de RF-CFG-001 (el cambio aplica a lo nuevo) y precondición de RF-PRO-001
      (marca y categoría registradas).
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-11]
    casos:
      - nivel: unitaria
        pasos:
          - Abrir ProductoFormDialog para crear y para editar un producto cuya marca y categoría no están activas.
          - Listar los activos con MarcaService.listarActivos (backend).
        datos: Marca activa Stanley; producto con marca Philips y categoría Antigua inactivas.
        esperado: >-
          Al crear solo aparece Stanley; al editar aparecen "Philips (inactiva)" y "Antigua (inactiva)";
          el servicio devuelve los activos ordenados.
      - nivel: integracion
        pasos:
          - Crear una marca (y una categoría), usarla en un producto y desactivarla.
          - Consultar /activas, crear otro producto con ella y editar el existente conservándola.
        datos: Marca y categoría con nombre único.
        esperado: Ya no aparece en /activas; el producto nuevo responde 400 en marcaId/categoriaId; el existente se edita (200).
      - nivel: e2e
        pasos:
          - Como administrador, crear una marca y abrir el selector de marca de un producto nuevo.
          - Desactivarla y volver a abrir el selector.
        datos: Marca "E2E <herramienta> Marca <sello>".
        esperado: La marca aparece en el selector mientras está activa y desaparece al desactivarla.

  # ------------------------------------------------------------------ RF-SEG-001 Usuarios, roles y sesión
  - id: CA-RF-SEG-001-1
    requisito: RF-SEG-001
    descripcion: Tras 5 intentos fallidos la cuenta se bloquea 15 minutos.
    niveles: [unitaria, integracion, e2e]
    observacion: La página de inicio de sesión muestra el aviso (Vitest, nivel unitario); falta el escenario E2E.
    casos:
      - nivel: unitaria
        pasos:
          - Simular 5 inicios de sesión con contraseña incorrecta en ServicioAutenticacion.
          - Intentar con la contraseña correcta antes y después de 15 minutos (reloj fijo).
          - Mostrar en LoginPage la respuesta CUENTA_BLOQUEADA.
        datos: Usuario con hash BCrypt simulado; reloj en 2026-10-21 10:00 Bogotá.
        esperado: Al quinto fallo bloqueado_hasta = ahora + 15 min; con la correcta sigue rechazado hasta que vence el plazo.
      - nivel: integracion
        pasos:
          - POST /api/v1/auth/login 5 veces con contraseña incorrecta.
          - Repetir con la contraseña correcta.
        datos: Usuario gerente del escenario.
        esperado: 423 CUENTA_BLOQUEADA con la hora de desbloqueo en es y en, aun con la contraseña correcta.

  - id: CA-RF-SEG-001-2
    requisito: RF-SEG-001
    descripcion: Un usuario sin permiso no ejecuta la operación, ni por interfaz ni por API.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-08, E2E-12, E2E-17]
    casos:
      - nivel: unitaria
        pasos:
          - Renderizar ProtectedRoute, ProductosPage y CatalogosPage con un usuario sin el permiso.
          - Terceros. TercerosPage y TerceroFormDialog con permisos de vendedor, comprador y jefe; TerceroService con un solo permiso de terceros.
        datos: Usuario sin CATALOGO_EDITAR o sin CONFIG_GESTIONAR; vendedor (solo clientes), comprador (solo proveedores) y jefe (sin terceros).
        esperado: >-
          No se muestra la acción, la entrada del menú ni la página; se redirige o se avisa acceso denegado. En terceros,
          la casilla del rol sin permiso está deshabilitada, un tercero de ese rol se abre en solo lectura y el servicio
          lanza AccessDeniedException al crear, editar (roles actuales y nuevos) o desactivar.
      - nivel: integracion
        pasos:
          - Recorrer cada endpoint de /api con el token de cada uno de los 6 roles (MatrizPermisosIntegracionTests).
          - Comprobar en la base que una operación denegada no deja rastro.
        datos: 33 endpoints × 6 roles con cuerpos válidos; productos, usuarios, marcas, categorías y terceros creados para cada caso.
        esperado: 2xx si la matriz 2.2 da el permiso; si no, 403 ACCESO_DENEGADO sin registro de auditoría.
      - nivel: e2e
        pasos:
          - Entrar como vendedor; revisar la tabla de productos.
          - Llamar a la API de crear y desactivar con su token.
        datos: Usuario vendedor.
        esperado: Sin botones de crear, editar ni desactivar; la API responde 403.
      - nivel: e2e
        pasos:
          - Entrar como vendedor; revisar el menú y abrir /catalogos directamente.
          - Llamar a la API de crear y desactivar marcas con su token.
        datos: Usuario vendedor.
        esperado: No ve la entrada Catálogos; la ruta muestra acceso denegado; la API responde 403.
      - nivel: e2e
        pasos:
          - Entrar como vendedor a Terceros; abrir un tercero nuevo y el proveedor Distribuidora Pavco (E2E-17).
          - Llamar a la API de crear un proveedor y desactivar Pavco con su token.
        datos: Usuario vendedor; proveedor id 2 de los datos de prueba.
        esperado: Casilla Proveedor deshabilitada con el motivo; Pavco solo tiene Ver y se abre en solo lectura; la API responde 403.

  - id: CA-RF-SEG-001-3
    requisito: RF-SEG-001
    descripcion: Los usuarios no se eliminan, solo se desactivan; una cuenta desactivada no inicia sesión.
    niveles: [unitaria, integracion, e2e]
    observacion: La página de inicio de sesión muestra el aviso (Vitest, nivel unitario); falta el escenario E2E.
    casos:
      - nivel: unitaria
        pasos:
          - Iniciar sesión en ServicioAutenticacion con un usuario inactivo y la contraseña correcta.
          - Mostrar en LoginPage la respuesta de cuenta inactiva.
        datos: Usuario con activo = false.
        esperado: Se rechaza sin emitir token.
      - nivel: integracion
        pasos:
          - PATCH /api/v1/usuarios/{id}/estado con activo false.
          - Iniciar sesión con ese usuario; intentar DELETE /api/v1/usuarios/{id}.
        datos: Usuario creado por el administrador.
        esperado: El login se rechaza; DELETE no existe (405) y el usuario sigue en la tabla.

  - id: CA-RF-SEG-001-D1
    requisito: RF-SEG-001
    descripcion: >-
      Con usuario y contraseña válidos el sistema inicia la sesión y muestra el nombre del usuario; con
      credenciales inválidas la rechaza con un aviso y no da acceso.
    origen: Pasos 1 y 2 del flujo principal de RF-SEG-001.
    niveles: [e2e]
    e2e: [E2E-01]
    casos:
      - nivel: e2e
        pasos:
          - Abrir /login, escribir una contraseña errada y enviar.
          - Escribir la contraseña correcta y enviar.
        datos: Usuario jefe con E2E_JEFE_PASSWORD.
        esperado: Con la errada, aviso y sigue en /login; con la correcta entra a productos y muestra "Julia Jefe Inventario".

  # ------------------------------------------------------------------ RF-SEG-002 Auditoría
  - id: CA-RF-SEG-002-1
    requisito: RF-SEG-002
    descripcion: Cada operación auditable genera exactamente un registro en la misma transacción.
    niveles: [integracion]
    casos:
      - nivel: integracion
        pasos:
          - Anotar el último id de auditoría.
          - Iniciar sesión (correcto y fallido), crear, editar e inactivar un producto y desactivar un usuario por la API.
          - Insertar y modificar un producto por SQL en una transacción que se revierte.
        datos: Usuarios del escenario; productos con nombre único.
        esperado: Un registro por operación (INICIAR_SESION, SESION_FALLIDA, CREAR, MODIFICAR) con usuario e IP; un UPDATE sin cambios no se audita; al revertir no queda nada.

  - id: CA-RF-SEG-002-2
    requisito: RF-SEG-002
    descripcion: Nadie puede modificar ni borrar un registro de menos de 24 meses.
    niveles: [integracion]
    casos:
      - nivel: integracion
        pasos:
          - PUT y DELETE sobre /api/v1/auditoria/{id} con el token del administrador.
          - UPDATE y DELETE sobre auditoria por SQL con el usuario de la aplicación.
        datos: Último registro de auditoría.
        esperado: 405 por la API y P0001 por SQL; el registro queda igual.

  - id: CA-RF-SEG-002-3
    requisito: RF-SEG-002
    descripcion: Un registro de 25 meses desaparece en la siguiente depuración mensual.
    niveles: [integracion]
    observacion: >-
      Se prueba la función fn_depurar_auditoria de la base; la tarea programada mensual que la invoca
      aún no está implementada.
    casos:
      - nivel: integracion
        pasos:
          - Insertar un registro con fecha de hace 25 meses y otro de hace 23.
          - Ejecutar fn_depurar_auditoria().
        datos: Particiones mensuales de auditoria.
        esperado: Desaparece el de 25 meses, queda el de 23 y se registra una constancia DEPURAR.

  # ------------------------------------------------------------------ RNF de seguridad
  - id: CA-RNF-SEG-001-1
    requisito: RNF-SEG-001
    descripcion: Toda ruta protegida responde 401 sin token.
    niveles: [integracion, e2e]
    e2e: [E2E-09]
    casos:
      - nivel: integracion
        pasos:
          - Llamar a cada endpoint de /api sin la cabecera Authorization (MatrizPermisosIntegracionTests).
          - Llamar con un token alterado y con uno vencido.
        datos: Los 20 endpoints protegidos con cuerpos válidos.
        esperado: 401 NO_AUTENTICADO en Problem Details en todos.
      - nivel: e2e
        pasos:
          - GET /api/v1/productos sin token desde la prueba.
        datos: Sin sesión.
        esperado: 401.

  - id: CA-RNF-SEG-001-D1
    requisito: RNF-SEG-001
    descripcion: Una página protegida abierta sin sesión lleva al inicio de sesión y no muestra su contenido.
    origen: Requisito de RNF-SEG-001 ("Todo acceso exige sesión autenticada"), aplicado a la interfaz.
    niveles: [e2e]
    e2e: [E2E-09]
    casos:
      - nivel: e2e
        pasos:
          - Abrir /productos en un navegador sin sesión.
        datos: Sin sesión.
        esperado: Redirige a /login y no muestra la tabla de productos.

  - id: CA-RNF-SEG-001-2
    requisito: RNF-SEG-001
    descripcion: Ninguna contraseña se guarda en texto plano.
    niveles: [integracion]
    casos:
      - nivel: integracion
        pasos:
          - Crear un usuario por la API y cambiarle la contraseña.
          - Crear dos usuarios con la misma contraseña.
          - Buscar las contraseñas en la tabla usuario y en la auditoría.
        datos: Contraseñas aleatorias que cumplen la política (letras y números).
        esperado: password_hash es BCrypt de costo 12 ($2a$12$...), verificable con BCryptPasswordEncoder; hashes distintos con la misma contraseña; ni la contraseña ni el hash aparecen en la auditoría ni en la respuesta.

  - id: CA-RNF-SEG-002-1
    requisito: RNF-SEG-002
    descripcion: 100 % de las pruebas de la matriz pasan por interfaz y por API.
    niveles: [integracion, e2e]
    observacion: Por API se recorren todos los endpoints publicados; por interfaz, E2E-08 cubre el vendedor.
    casos:
      - nivel: integracion
        pasos:
          - Recorrer cada endpoint contra cada rol y comprobar 2xx o 403.
          - Verificar que la matriz probada cubra todos los endpoints publicados en /api.
          - Verificar los permisos que lleva el token de cada rol.
        datos: 20 endpoints × 6 roles; tabla rol_permiso de V1.
        esperado: 120 de 120 combinaciones según la matriz 2.2; ningún endpoint sin probar; admin 26, gerente 22, jefe 8, comprador 7, vendedor 6 y auditor 4 permisos.

  - id: CA-RNF-SEG-003-1
    requisito: RNF-SEG-003
    descripcion: >-
      Cada operación de prueba genera su registro (usuario, fecha, IP, acción y valores antes y después).
    niveles: [integracion]
    casos:
      - nivel: integracion
        pasos:
          - Crear y modificar un producto por la API con el token del jefe.
          - Leer los registros de auditoría de ese producto.
        datos: Producto con margen 30 que se cambia a 45.
        esperado: CREAR (sin antes) y MODIFICAR (antes 30.00, después 45.00), ambos con usuario_id del jefe e IP 127.0.0.1.

  - id: CA-RNF-SEG-003-2
    requisito: RNF-SEG-003
    descripcion: Retención de 24 meses.
    niveles: [integracion]
    casos:
      - nivel: integracion
        pasos:
          - Ejecutar la depuración con registros de 23 y 25 meses.
        datos: Igual que CA-RF-SEG-002-3.
        esperado: Se conserva el de 23 meses y se elimina el de 25.

  - id: CA-RNF-SEG-004-1
    requisito: RNF-SEG-004
    descripcion: >-
      Los intentos de editar o borrar la auditoría y los documentos confirmados, por API y por SQL con el
      usuario de la aplicación, son rechazados.
    niveles: [integracion]
    observacion: Por ahora cubre la auditoría; los documentos confirmados se agregarán con compras y ventas.
    casos:
      - nivel: integracion
        pasos:
          - Igual que CA-RF-SEG-002-2 (API y SQL sobre auditoria).
        datos: Último registro de auditoría.
        esperado: 405 por la API y P0001 por SQL.

  - id: CA-RNF-SEG-005-1
    requisito: RNF-SEG-005
    descripcion: Sin hallazgos altos en pruebas OWASP Top 10.
    niveles: [e2e]
    observacion: >-
      Requiere un escaneo OWASP sobre la aplicación desplegada. El backend ya prueba partes (búsqueda sin
      inyección de comodines, CORS, cabeceras de seguridad), pero no reemplazan el escaneo.
    casos:
      - nivel: e2e
        pasos:
          - Levantar docker-compose.e2e.yml y ejecutar un escaneo OWASP ZAP (baseline y API con openapi.yaml).
        datos: URL del frontend y especificación docs/api/openapi.yaml.
        esperado: 0 alertas de riesgo alto. (Prueba prevista.)

  - id: CA-RNF-SEG-005-2
    requisito: RNF-SEG-005
    descripcion: Bloqueo tras 5 intentos fallidos.
    niveles: [unitaria, integracion]
    casos:
      - nivel: unitaria
        pasos:
          - Igual que el caso unitario de CA-RF-SEG-001-1.
        datos: Usuario con 4 intentos fallidos.
        esperado: El quinto fallo bloquea la cuenta.
      - nivel: integracion
        pasos:
          - Igual que el caso de integración de CA-RF-SEG-001-1.
        datos: Usuario gerente.
        esperado: 423 CUENTA_BLOQUEADA.

  - id: CA-RNF-SEG-006-1
    requisito: RNF-SEG-006
    descripcion: HTTPS obligatorio.
    niveles: [integracion, e2e]
    observacion: >-
      El backend verifica la cabecera HSTS, también detrás del proxy TLS de Render (perfil prod); el
      certificado y la redirección a HTTPS los aporta Render (docs/despliegue.md).
    casos:
      - nivel: integracion
        pasos:
          - Hacer solicitudes HTTPS (secure) con respuestas 200, 401 y 403, al login y al actuator.
          - Hacer la misma solicitud por HTTP plano.
          - Con el perfil prod, llamar al actuator con X-Forwarded-Proto https, como lo hace el proxy TLS de Render.
        datos: Tokens de admin y vendedor; sin token.
        esperado: Toda respuesta HTTPS lleva Strict-Transport-Security max-age=31536000 ; includeSubDomains, además de nosniff y X-Frame-Options DENY; por HTTP no se envía HSTS; detrás del proxy de Render también se envía HSTS.

  - id: CA-RNF-SEG-006-2
    requisito: RNF-SEG-006
    descripcion: La sesión expira tras 30 minutos de inactividad.
    niveles: [unitaria, integracion, e2e]
    observacion: >-
      El backend emite tokens que vencen 30 minutos después de emitidos y rechaza los vencidos; la
      renovación mientras el usuario está activo se verificará en e2e.
    casos:
      - nivel: unitaria
        pasos:
          - Emitir un token con ServicioToken y reloj fijo.
        datos: Reloj en 2026-10-21 10:00.
        esperado: exp = iat + 30 minutos; expiresIn = 1800.
      - nivel: integracion
        pasos:
          - Llamar a /api/v1/auth/me con un token vencido.
        datos: Token firmado con la clave de la aplicación y exp en el pasado.
        esperado: 401.

  # ------------------------------------------------------------------ RNF de eficiencia
  - id: CA-RNF-REN-001-1
    requisito: RNF-REN-001
    descripcion: >-
      Búsqueda por código y confirmación de venta rápidas con el volumen de diseño: percentil 95 menor a 1 s.
    niveles: [carga]
    medicion: k6
    observacion: >-
      k6 mide búsqueda por nombre, consulta por id y creación de productos (código de barras y ventas aún no
      existen). Solo el modo carga sobre ferreteria_carga usa el volumen de diseño; el modo humo de la CI
      corre con 1 usuario sobre el escenario de prueba y es una verificación débil.
    casos:
      - nivel: carga
        pasos:
          - Cargar load-tests/datos-volumen.sql en ferreteria_carga y levantar el entorno contra esa base.
          - Ejecutar k6 run load-tests/productos.js (50 usuarios, 5 minutos; 70 % buscar, 20 % consultar, 10 % crear).
        datos: 100.000 presentaciones y 50.000 productos; usuario jefe.
        esperado: p95 de http_req_duration < 1000 ms (umbral de k6).

  - id: CA-RNF-REN-003-1
    requisito: RNF-REN-003
    descripcion: 50 usuarios concurrentes en prueba de carga sin errores ni saldos negativos.
    niveles: [carga]
    medicion: k6
    observacion: >-
      Solo cuenta un resumen de k6 en modo carga (50 usuarios virtuales o más); el modo humo no lo
      demuestra. Los saldos negativos se verificarán cuando existan ventas.
    casos:
      - nivel: carga
        pasos:
          - Igual que CA-RNF-REN-001-1, con 50 usuarios virtuales constantes.
        datos: 100.000 presentaciones; 50 VU durante 5 minutos.
        esperado: http_req_failed < 1 % (umbral de k6) y todas las comprobaciones de respuesta aprobadas.

  # ------------------------------------------------------------------ RNF de interacción
  - id: CA-RNF-INT-002-1
    requisito: RNF-INT-002
    descripcion: Cada regla de validación muestra campo y causa.
    niveles: [unitaria, integracion, e2e]
    e2e: [E2E-03]
    casos:
      - nivel: unitaria
        pasos:
          - Validar con productoSchema cada regla (obligatorios, longitudes, rango del margen, garantía).
          - Renderizar ProductoFormDialog y enviarlo con errores.
        datos: Un valor inválido por regla; idioma es y en.
        esperado: Un mensaje por campo con su causa, traducido.
      - nivel: integracion
        pasos:
          - Enviar a la API peticiones inválidas de producto y de login, con Accept-Language es y en.
        datos: Margen 501, nombre corto, campos vacíos, orden desconocido.
        esperado: 400 en Problem Details con un error por campo (campo y mensaje) en el idioma pedido.
      - nivel: e2e
        pasos:
          - Igual que el caso e2e de CA-RF-PRO-001-2.
        datos: Formulario vacío y valores fuera de rango.
        esperado: Cada campo muestra su etiqueta y "Este campo es obligatorio" u otra causa.

  - id: CA-RNF-INT-003-1
    requisito: RNF-INT-003
    descripcion: Moneda como $ 12.350, fechas dd/mm/aaaa, zona horaria America/Bogota.
    niveles: [unitaria, e2e]
    e2e: [E2E-10]
    observacion: >-
      El backend formatea fechas en mensajes (bloqueo de cuenta); E2E-10 verifica la moneda en pantalla
      ($ 18.000). Las fechas en pantalla se verificarán cuando una página las muestre.
    casos:
      - nivel: unitaria
        pasos:
          - Bloquear una cuenta con el reloj fijo y leer el mensaje.
        datos: Reloj en UTC; desbloqueo 15 minutos después.
        esperado: La hora aparece en Bogotá con formato dd/MM/yyyy HH:mm.
      - nivel: e2e
        pasos:
          - Abrir Productos como jefe.
        datos: Producto del escenario con último costo 18.000.
        esperado: La moneda se muestra como $ 18.000.

  - id: CA-RNF-INT-003-D1
    requisito: RNF-INT-003
    descripcion: >-
      La interfaz se muestra en español por defecto y puede cambiarse a inglés; la elección se conserva al
      recargar la página y al cerrar la sesión.
    origen: Requisito de RNF-INT-003 (interfaz en español) y regla de internacionalización del proyecto.
    niveles: [e2e]
    e2e: [E2E-10]
    casos:
      - nivel: e2e
        pasos:
          - Entrar y comprobar el idioma; cambiar a inglés.
          - Recargar y cerrar la sesión.
        datos: Usuario jefe.
        esperado: Arranca en español (lang="es"); en inglés cambian títulos, botones, menú y estados; la elección sobrevive a recargar y a cerrar sesión.

  # ------------------------------------------------------------------ RNF de mantenibilidad
  - id: CA-RNF-MAN-001-1
    requisito: RNF-MAN-001
    descripcion: Cobertura del backend mayor o igual a 70 %.
    niveles: [unitaria, integracion]
    medicion: jacoco
    observacion: >-
      Lo verifica la regla jacoco:check del pom (cobertura de líneas >= 0.70) en ./mvnw verify, no una
      prueba con nombre; scripts/criterios.mjs lee backend/target/site/jacoco/jacoco.csv.
    casos:
      - nivel: integracion
        pasos:
          - Ejecutar ./mvnw verify (pruebas unitarias y de integración con el agente de JaCoCo).
        datos: Todas las pruebas del backend.
        esperado: Cobertura de líneas >= 70 %; si no, jacoco:check hace fallar el build.
