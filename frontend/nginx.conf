# Nombre: nginx.conf
# Descripción: Servidor del frontend compilado: entrega la SPA (toda ruta desconocida vuelve a
#              index.html para React Router) y reenvía /api al backend en la red de Docker.
# Fecha de creación: 2026-10-21
# Última actualización: 2026-10-21
# Autor: Juan Pablo Artunduaga Pérez (generado con Claude Code)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: mismo origen para el navegador, sin depender de CORS
    location /api/ {
        proxy_pass http://backend:8080;
        # Host con el puerto: así Spring reconoce las peticiones del navegador como del mismo origen
        # (con $host el puerto se pierde y CORS rechaza el login con 403)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas de la SPA (/login, /productos, ...)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
